# The Coco -- one declaration of what the hub is made of.
#
# WHY THIS FILE EXISTS. The Coco is assembled out of three frozen
# pillars and its own four materials, and until now every script knew
# some of that on its own: build.sh carried the module list, run.sh
# carried the case list, crypto.sh worked out the library path a second
# time, and CLAUDE.md wrote the environment down a third. Four copies of
# one fact drift, and the drift is silent. This is the one copy. The
# scripts read it through `test/config.sh'; nothing here is decoration.
#
# THE ENVIRONMENT STILL WINS. Every value below is a DEFAULT. If CICILI,
# ZIGURATIP, ZIGURATIP_HOME, COCOLOG, COCOLOG_LIBRARY, ZIGURAT_HOST or
# ZIGURAT_PORT is already set when a script runs, that is what is used --
# so a checkout somewhere unusual needs no edit here, and CI can point
# the whole hub at a scratch tree with a line of exports.
#
# THE SUBSET IS SMALL, deliberately: `key: value' two levels deep, and
# `- item' lists. There is no YAML parser in this repository and there
# will not be one -- config.sh is thirty lines of awk, and a config file
# that needs more than that is a config file doing something it should
# not. Values are expanded by the shell, so ${ZIGURATIP} below means what
# it says.

# ---- the three pillars ----------------------------------------------
# Inputs, all of them. The Coco uses these and modifies none; see
# CLAUDE.md. Paths are checkouts, not installs.
#
# The defaults are SIBLINGS OF THIS REPOSITORY rather than anything under
# ${HOME}: the four checkouts sit side by side in every place the family
# is worked on, and a home directory is not the same in a container as it
# is on a laptop. config.sh normalises these, so `..' does not survive
# into anything a script prints.
pillars:
  cicili: ${ROOT}/../cicili                # the language, for sbcl at build time
  zigurat: ${ROOT}/../ZiguratIP            # a BUILT ZiguratIP
  zigurat_home: ${ROOT}/../ZiguratIP/home  # and its home: ld/, data/, bin/
  cocolog: ${ROOT}/../cocolog              # a BUILT cocolog checkout

# ---- where a library is looked up -----------------------------------
# `use_module(library(Name))' searches COCOLOG_LIBRARY, then ./library.
# The Coco's own .pl libraries and compiled .so modules both land here,
# which is what lets library(eth) be Prolog and library(keccak) be C
# without a caller knowing the difference.
paths:
  library: ${ROOT}/library

# ---- the knowledge base the wire cases speak to ----------------------
arrangement:
  host: 127.0.0.1
  port: 2160
  timeout: 15
  kb: coco_hello

# ---- the Cicili modules, in build order ------------------------------
# Order matters only in that a module is built before anything that
# loads it; these are independent, so the order is the order they were
# written. Each is modules/crypto/<name>.cicili and becomes
# <library>/<name>.so.
modules:
  # The width an exchange needs. cocolog's integers are 64 bits and they
  # WRAP IN SILENCE -- 1000000000000000000 * 997 answers
  # 875820019684212736 -- so the first product a Uniswap swap computes at
  # ordinary token scale is already a wrong number nobody was told about.
  # These are 256-bit and nothing in them wraps: an operation that cannot
  # represent its answer raises instead.
  math:
    - u256           # add, sub, mul, div, mod, muldiv, sqrt -- none wrapping
  crypto:
    - keccak         # Ethereum's, with the 0x01 pad -- not NIST SHA3
    - secp256k1      # the curve: derive, verify, recover
    - sha512         # what Ed25519 hashes with
    - ed25519        # RFC 8032, deterministic, byte for byte
    - sha256         # Bitcoin's, and half of hash160
    - ripemd160      # the other half
    - blake2b        # Sui, Aptos, Polkadot, Cardano, Zcash
    - spine          # rung 5: the tick loop -- iterated sha256, in C

# ---- the Prolog libraries --------------------------------------------
# The other half of the library path: clauses, no build step, loaded by
# the same `use_module(library(Name))' as the compiled modules above. A
# caller cannot tell the two apart, which is the point of the seam --
# library(btc) composes two compiled modules and two Prolog ones and
# reads the same either way.
#
# Listed here so the suite can prove every one of them LOADS. A .pl with
# a syntax error in a clause nothing calls is invisible until the day
# something calls it.
libraries:
  prolog:
    - bytes          # hex text to byte lists and back
    - base58         # base58 and base58check
    - bech32         # bech32, bech32m, segwit addresses
    - eth            # keccak + secp256k1: Ethereum addresses, who signed
    - btc            # sha256 + ripemd160 + base58 + bech32: Bitcoin
    - poa            # rung 2: proof of authority, as rules
    - contract       # rung 3: the fence, scoped state, the call door
    - settle         # rung 4: the acceptance predicate over held-out data
    - poh            # rung 5: segments, parallel verification, the ledger seam
    - pos            # rung 6: weight as a query, and the leader draw
    - bft            # rung 6: votes, quorum certificates, the lock, the evidence
    - hub            # rung 7: rules as entries, the namespace, the anchor, the bridge
    - uniswap        # a constant-product pool as rules, over library(bigint)

# ---- the suite -------------------------------------------------------
# `red: 0' does not mean the suite passed: wire SKIPs without a server.
# Read the per-case lines. (cocolog's CLAUDE.md, inherited.)
suite:
  cases:
    - local          # the binary consults a .pl and answers
    - math           # library(u256): the width an exchange needs, and its refusals
    - crypto         # the primitives, against published vectors
    - wire           # one process writes, a second reads it back
    - ledger         # rung 2: the PoA federation, and mallory attacking it
    - contracts      # rung 3: a contract is a predicate; mallory writes them too
    - training       # rung 4: train freely, verify deterministically, commit rows
    - spine          # rung 5: a clock nobody can wind backwards
    - votes          # rung 6: stake off the chain, quorums, finality
    - hub            # rung 7: many chains, one node, none known in advance
    - uniswap        # the pool: the quote, the invariant, and mallory at it
    - bench          # rung 8: the harness's rules -- not its timings
